[project]
name = "sumeds"
version = "0.6.9"
description = "Lazy, privacy-aware code occurrence summaries for MEDS datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["MEDS", "healthcare", "Polars", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
authors = [
    { name = "Robin P. van de Water", email = "robin.vandewater@hpi.de" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "meds>=0.4.1,<0.5",
    "polars>=1.30",
    "pyarrow>=15",
    "pyyaml>=6",
    "tqdm>=4.67",
]

[project.optional-dependencies]
rt64 = ["polars[rt64]>=1.34"]
notebook = ["jupyter>=1.0", "ipykernel>=6.30"]
# `sumeds.testing.contracts`: the pytest contract tests for ETLs that use suMEDS's stages.
# `UnitComponentContract` evaluates the spec's expressions with dftly, as MEDS-Extract does.
testing = ["pytest>=8", "dftly>=0.7; python_version >= '3.11'"]

[project.scripts]
suMEDS = "sumeds.cli:main"
suMEDS-enrich = "sumeds.cli:enrich_main"
suMEDS-extract = "sumeds.extract:main"
suMEDS-normalize-units = "sumeds.cli:normalize_units_main"
suMEDS-link-unit-siblings = "sumeds.cli:link_unit_siblings_main"

# The sumeds_enrich, sumeds_normalize_units and sumeds_link_unit_siblings post-stages, for
# MEDS-Extract specs (MEDS-Extract >= 0.8.1).
[project.entry-points."MEDS_transforms.stages"]
sumeds_enrich = "sumeds.stage:main"
sumeds_normalize_units = "sumeds.units_stage:main"
sumeds_link_unit_siblings = "sumeds.unit_siblings_stage:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6",
    "pre-commit>=4.0",
    "pytest>=8",
    # `UnitComponentContract` evaluates a spec's expressions with dftly (tests/test_testing.py).
    "dftly>=0.7; python_version >= '3.11'",
    "ruff>=0.15.22",
    # Checks that suMEDS's canonical unit spellings are valid UCUM (tests/test_units.py).
    "ucumvert>=0.3.3; python_version >= '3.11'",
]
