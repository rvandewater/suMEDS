[project]
name = "sumeds"
version = "0.1.3"
description = "Lazy, privacy-aware code occurrence summaries for MEDS datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["MEDS", "healthcare", "Polars", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
authors = [
    { name = "Robin P. van de Water", email = "robin.vandewater@hpi.de" }
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "meds>=0.4.1,<0.5",
    "polars>=1.30",
    "pyarrow>=15",
    "pyyaml>=6",
    "tqdm>=4.67",
]

[project.optional-dependencies]
rt64 = ["polars[rt64]>=1.34"]

[project.scripts]
suMEDS = "sumeds.cli:main"
suMEDS-enrich = "sumeds.cli:enrich_main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6",
    "pre-commit>=4.0",
    "pytest>=8",
    "ruff>=0.15.22",
]
