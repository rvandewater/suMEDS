name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, "release/*", "dev"]
  schedule:
    - cron: "0 0 */14 * *" # Runs every two weeks at midnight UTC

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e ".[tests, polars, pandas]"
          pip install pytest pytest-cov --upgrade
          # The UCUM validator of tests/test_units.py (Python >= 3.11; skipped otherwise).
          pip install "ucumvert>=0.3.3; python_version >= '3.11'"
          # UnitComponentContract (tests/test_testing.py) evaluates specs with dftly (Python >= 3.11).
          pip install "dftly>=0.7; python_version >= '3.11'"

      # The end-to-end tests (tests/test_stage.py, tests/test_unit_siblings.py and the
      # EnrichmentContract of tests/test_testing.py) run meds-extract-run, which supports
      # Python 3.11.4 to 3.13; they are skipped where it is not installed.
      - name: Install MEDS-Extract for the end-to-end tests
        if: ${{ matrix.python-version != '3.10' && matrix.python-version != '3.14' }}
        run: pip install "meds-extract>=0.9.0,<0.10"

      - name: Check out the pinned ontology data release
        run: |
          REF=$(python -c "from sumeds.ontology import DEFAULT_REF; print(DEFAULT_REF)")
          git clone --quiet --depth 1 --branch "$REF" \
            https://github.com/rvandewater/sumeds-ontologies "$RUNNER_TEMP/sumeds-ontologies"
          echo "SUMEDS_ONTOLOGIES_DIR=$RUNNER_TEMP/sumeds-ontologies/ontologies" >> "$GITHUB_ENV"

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          pytest src/ tests/ -v --doctest-modules --cov=src --junitxml=junit.xml -s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
